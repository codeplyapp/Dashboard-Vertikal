[project]
name = "g7kaih-dashboard"
version = "1.0.0"
description = "Dashboard pemantauan 7 Kebiasaan Anak Indonesia Hebat - SMAN 2 Taruna Bhayangkara Jawa Timur"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.67.0",
    "pandas==3.1.1",
    "plotly==7.1.0",
    "openpyxl==3.1.5",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["g7kaih*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
